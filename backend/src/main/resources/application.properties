# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/taskflowai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=TaskFlowAI-Super-Secret-Key-Change-In-Production-2026-Kolhapur-Parth
app.jwt.expiration-ms=86400000

# ===== CORS (frontend dev server) =====
app.cors.allowed-origins=http://localhost:5501,http://127.0.0.1:5501,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

# ===== Jackson =====
spring.jackson.default-property-inclusion=non_null
