<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects · TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body data-page="projects">
<div class="app-shell">
  <div class="sidebar-overlay"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="logo-mark">T</span><span>TaskFlow</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class=""><span class="nav-ic">🏠</span><span class="nav-label">Dashboard</span></a>
<a href="projects.html" class="active"><span class="nav-ic">📁</span><span class="nav-label">Projects</span></a>
<a href="tasks.html" class=""><span class="nav-ic">📋</span><span class="nav-label">Tasks</span></a>
<a href="kanban.html" class=""><span class="nav-ic">📊</span><span class="nav-label">Kanban Board</span></a>
<a href="calendar.html" class=""><span class="nav-ic">🗓️</span><span class="nav-label">Calendar</span></a>
<a href="reports.html" class=""><span class="nav-ic">📈</span><span class="nav-label">Reports</span></a>
<a href="notifications.html" class=""><span class="nav-ic">🔔</span><span class="nav-label">Notifications</span></a>
<a href="profile.html" class=""><span class="nav-ic">👤</span><span class="nav-label">Profile</span></a>
<a href="settings.html" class=""><span class="nav-ic">⚙️</span><span class="nav-label">Settings</span></a>
<a href="login.html" data-logout><span class="nav-ic">🚪</span><span class="nav-label">Logout</span></a>

    </nav>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <div class="search-bar">
          <span>🔍</span>
          <input type="search" placeholder="Search projects...">
        </div>
      </div>
      <div class="topbar-right">
        <div style="position:relative">
          <button class="icon-btn" data-dropdown-trigger="notifDropdown" aria-label="Notifications">🔔<span class="dot"></span></button>
          <div class="dropdown-menu" id="notifDropdown" style="min-width:280px">
            <div style="padding:8px 12px;font-weight:700;font-size:.85rem">Notifications</div>
            <a href="notifications.html">📝 Task assigned to you</a>
            <a href="notifications.html">⏰ Task due tomorrow</a>
            <a href="notifications.html">💬 New comment on task</a>
            <div class="dropdown-divider"></div>
            <a href="notifications.html" style="justify-content:center;color:var(--color-primary);font-weight:700">View all</a>
          </div>
        </div>
        <div style="position:relative">
          <div class="user-chip" data-dropdown-trigger="userDropdown">
            <img class="avatar" src="https://i.pravatar.cc/64?img=12" alt="John Doe">
            <div class="user-meta"><div class="name">John Doe</div><div class="role">Project Manager</div></div>
          </div>
          <div class="dropdown-menu" id="userDropdown">
            <a href="profile.html">👤 My Profile</a>
            <a href="settings.html">⚙️ Settings</a>
            <div class="dropdown-divider"></div>
            <button data-logout>🚪 Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">

      <div class="page-header">
        <h1 class="page-title" style="margin-bottom:0">Projects</h1>
        <button class="btn btn-primary" data-modal-open="newProjectModal">+ New Project</button>
      </div>

      <div class="filters-bar">
        <div class="tab-group">
          <button class="active">All</button>
          <button>Active</button>
          <button>Completed</button>
          <button>On Hold</button>
        </div>
        <div class="search-bar" style="max-width:280px">
          <span>🔍</span><input type="search" placeholder="Search projects...">
        </div>
      </div>

      <div class="grid-cards" id="projectsGrid"></div>

<!-- New Project Modal -->
<div class="modal-overlay" id="newProjectModal">
  <div class="modal">
    <div class="modal-header"><h3>Create New Project</h3><button class="modal-close" data-modal-close>✕</button></div>
    <form data-validate="project">
      <div class="modal-body">
        <div class="form-group"><label>Project Name</label><input type="text" name="name" placeholder="e.g. Website Redesign" required></div>
        <div class="form-group"><label>Description</label><textarea name="desc" placeholder="What is this project about?"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Due Date</label><input type="date" name="due" required></div>
          <div class="form-group"><label>Status</label>
            <select name="status"><option>Active</option><option>On Hold</option><option>Completed</option></select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Create Project</button>
      </div>
    </form>
  </div>
</div>
    </main>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
